<!doctype html>
<html>
    <head>
        <title>Rethink device monitor</title>
        <link rel="icon" href="favicon.svg" type="image/svg+xml" />
        <style>
            .status_label {
                width: 10em;
                display: inline-block;
            }
            .flex_x {
                display: flex;
                flex-direction: row;
                align-items: center;
            }
            .flex_y {
                display: flex;
                flex-direction: column;
            }
            .flex_grow {
                flex: 1;
            }
            #messages {
                border: solid 1px var(--rethink-border);
                border-radius: 8px;
                padding: 8px;
                overflow-y: scroll;
                margin-bottom: 8px;
            }
            body {
                height: 100vh;
            }

            .message {
                clear: both;
                border: solid 1px var(--rethink-border);
                border-radius: 4px;
                padding: 2px 4px;
                margin: 2px;
                word-wrap: anywhere;
            }

            .tx.message {
                float: right;
                background: rgb(117, 42, 119);
                color: white;
            }
            .rx.message {
                float: left;
                background: rgb(116, 171, 203);
                color: #0d1b24;
            }

            .message.injected {
                background: #c04040;
                color: white;
            }

            .message .timestamp {
                background: #ffd23f;
                color: #14181f;
                margin: 0px 8px;
                padding: 0px 4px;
                border-radius: 2px;
            }
            .rx.message .timestamp {
                float: left;
            }
            .tx.message .timestamp {
                float: right;
            }

            .message-hex {
                font-family: monospace;
                font-size: 0.85em;
            }

            /* Server-decoded TLV/AABB fields (see util/packet-codec.ts / management/index.ts) -
               omitted entirely for anything that didn't decode, so no empty box appears. */
            .decoded {
                margin-top: 4px;
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
                font-size: 0.78em;
            }

            .decoded-status,
            .decoded-field {
                background: rgba(255, 255, 255, 0.25);
                border-radius: 3px;
                padding: 1px 5px;
                font-family: monospace;
            }

            .decoded-status.ok {
                background: rgba(80, 200, 120, 0.35);
            }

            .decoded-status.bad {
                background: rgba(220, 80, 80, 0.45);
            }

            .reduced_margins .input-field {
                margin: 4px;
            }
        </style>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"
        />
        <link rel="stylesheet" href="style.css" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    </head>

    <body class="flex_y">
        <nav class="light-blue lighten-1" role="navigation">
            <div class="nav-wrapper container">
                <a id="logo-container" href="/" class="brand-logo">
                    <span class="material-icons">psychology_alt</span>
                    Rethink management panel
                </a>
            </div>
        </nav>
        <div class="container">
            <h4 class="header orange-text">Device status</h4>
            <span class="status_label">Device ID:</span> <span id="device_id" class="status_value"></span> <br />
            <span class="status_label">Device model:</span> <span id="device_model" class="status_value"></span> <br />
            <span class="status_label">Status:</span> <span id="device_status" class="status_value"></span> <br />
        </div>

        <div class="reduced_margins container flex_y flex_grow" style="overflow: hidden">
            <h4 class="header orange-text">
                Messages
                <div style="float: right">
                    <label for="autoscroll">Auto-scroll</label>
                    <span class="switch">
                        <label
                            >Off <input id="autoscroll" type="checkbox" checked /> <span class="lever"></span>On</label
                        >
                    </span>
                </div>
            </h4>
            <div class="flex_grow" id="messages"></div>
            <div class="flex_x">
                <div class="input-field flex_grow">
                    <input id="send1" type="text" />
                    <label for="send1">Send to device</label>
                </div>
                &nbsp;
                <div class="input-field">
                    <button disabled class="btn waves-effect waves-light" id="btn_send1">
                        Send <i class="material-icons right">send</i>
                    </button>
                </div>
            </div>
            <div class="flex_x">
                <div class="input-field">
                    <button disabled class="btn waves-effect waves-light" id="btn_send2">
                        Send <i class="material-icons left">send</i>
                    </button>
                </div>
                &nbsp;
                <div class="input-field flex_grow">
                    <input id="send2" type="text" />
                    <label for="send2">Inject from device</label>
                </div>
            </div>
        </div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
        <script src="monitor.js"></script>
    </body>
</html>
